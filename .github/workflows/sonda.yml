name: Sonda de índices (temporário)

# Teste do robô sem gravar nada (SECO=1) e sem segredos. Sai antes de ir para a main.
on:
  push:
    branches: [claude/project-thread-eup04h]
    paths: [scripts/indices.mjs, .github/workflows/sonda.yml]

jobs:
  sonda:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: SECO=1 node scripts/indices.mjs
